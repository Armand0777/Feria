# Revisión automática en cada push y pull request: el código debe pasar el
# linter y compilar. La insignia del README muestra el resultado.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint -- --deny-warnings
      - run: npm run build
